name: Public App Discovery and SEO QA
on:
  pull_request:
    branches: [main]
    paths:
      - apps.html
      - index.html
      - support/brain-burst/index.html
      - support/taletime/index.html
      - support/snaplingo/index.html
      - support/twotaku/index.html
      - support/debate-me/index.html
      - support/idea-market/index.html
      - support/blur/index.html
      - tests/blur-support-growth.test.mjs
      - support/instant-judge/index.html
      - tests/instant-judge-support-growth.test.mjs
      - support/roast-me/index.html
      - tests/roastme-support-growth.test.mjs
      - support/future-me/index.html
      - tests/futureme-support-growth.test.mjs
      - tests/idea-market-support-growth.test.mjs
      - tests/debate-me-support-growth.test.mjs
      - tests/dotchi-support-growth.test.mjs
      - support/face-reaction-battle/index.html
      - robots.txt
      - apps_data.json
      - guides/**
      - sitemap.xml
      - scripts/build_catalog.py
      - scripts/test_sitemap_route_integrity.py
      - scripts/test_sitemap_growth_freshness.py
      - scripts/test_live_smoke_diagnostics.py
      - scripts/diagnose_growth_routes.py
      - scripts/diagnose_growth_deploy.py
      - scripts/test_diagnose_growth_routes.py
      - scripts/test_diagnose_growth_deploy.py
      - scripts/test_live_smoke_source_parity.py
      - scripts/preflight_app_discovery.py
      - scripts/test_preflight_app_discovery.py
      - scripts/test_press_kit.py
      - scripts/test_publish_app_discovery_staging.py
      - press/**
      - site_counts.json
      - tests/catalog-growth.test.mjs
      - tests/japanese-quick-games-discovery.test.mjs
      - tests/catalog-positioning-regression.test.mjs
      - tests/search-landing-growth.test.mjs
      - scripts/publish_app_discovery.sh
      - scripts/publish_stale_policy_pages.sh
      - scripts/check_app_discovery_live.sh
      - .github/workflows/app-discovery-qa.yml
      - .github/workflows/live-acquisition-smoke.yml
  push:
    branches: [main]
    paths:
      - apps.html
      - index.html
      - support/brain-burst/index.html
      - support/taletime/index.html
      - support/snaplingo/index.html
      - support/twotaku/index.html
      - support/debate-me/index.html
      - support/idea-market/index.html
      - support/blur/index.html
      - tests/blur-support-growth.test.mjs
      - support/instant-judge/index.html
      - tests/instant-judge-support-growth.test.mjs
      - support/roast-me/index.html
      - tests/roastme-support-growth.test.mjs
      - support/future-me/index.html
      - tests/futureme-support-growth.test.mjs
      - tests/idea-market-support-growth.test.mjs
      - tests/debate-me-support-growth.test.mjs
      - tests/dotchi-support-growth.test.mjs
      - support/face-reaction-battle/index.html
      - robots.txt
      - apps_data.json
      - guides/**
      - sitemap.xml
      - scripts/build_catalog.py
      - scripts/test_sitemap_route_integrity.py
      - scripts/test_sitemap_growth_freshness.py
      - scripts/test_live_smoke_diagnostics.py
      - scripts/diagnose_growth_routes.py
      - scripts/diagnose_growth_deploy.py
      - scripts/test_diagnose_growth_routes.py
      - scripts/test_diagnose_growth_deploy.py
      - scripts/test_live_smoke_source_parity.py
      - scripts/preflight_app_discovery.py
      - scripts/test_preflight_app_discovery.py
      - scripts/test_press_kit.py
      - scripts/test_publish_app_discovery_staging.py
      - press/**
      - site_counts.json
      - tests/catalog-growth.test.mjs
      - tests/catalog-positioning-regression.test.mjs
      - tests/search-landing-growth.test.mjs
      - scripts/publish_app_discovery.sh
      - scripts/publish_stale_policy_pages.sh
      - scripts/check_app_discovery_live.sh
      - .github/workflows/app-discovery-qa.yml
      - .github/workflows/live-acquisition-smoke.yml
permissions:
  contents: read
jobs:
  discovery-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm catalog generator remains idempotent
        run: python3 scripts/build_catalog.py --check
      - name: Verify sitemap URLs, source HTML and canonical integrity
        run: python3 -m unittest scripts.test_sitemap_route_integrity scripts.test_sitemap_growth_freshness -v
      - name: Verify live failure inventory stays read-only and fail-closed
        run: python3 -m unittest scripts.test_live_smoke_diagnostics -v
      - name: Verify 15 public deployment diagnostic routes and failure handling
        run: python3 -m unittest scripts.test_diagnose_growth_routes scripts.test_diagnose_growth_deploy -v
      - name: Verify public smoke string assertions match current source
        run: python3 -m unittest scripts.test_live_smoke_source_parity -v
      - name: Verify multilingual press and real local rsync release staging
        run: python3 -m unittest scripts.test_preflight_app_discovery scripts.test_press_kit scripts.test_publish_app_discovery_staging -v
      - name: Verify non-destructive release scripts have valid shell syntax
        run: bash -n scripts/publish_app_discovery.sh scripts/check_app_discovery_live.sh scripts/publish_stale_policy_pages.sh
      - name: Verify search, referral links and guide listings
        run: node --test tests/catalog-growth.test.mjs tests/japanese-quick-games-discovery.test.mjs tests/catalog-positioning-regression.test.mjs tests/search-landing-growth.test.mjs tests/dotchi-support-growth.test.mjs tests/debate-me-support-growth.test.mjs tests/idea-market-support-growth.test.mjs tests/blur-support-growth.test.mjs tests/instant-judge-support-growth.test.mjs tests/roastme-support-growth.test.mjs tests/futureme-support-growth.test.mjs

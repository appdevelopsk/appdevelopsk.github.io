<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="canonical" href="https://appdevelopsk.com/share/debate-me/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SK APPS">
  <meta property="og:title" content="Debate Me – AI Debate Practice">
  <meta property="og:description" content="Practice your arguments against an AI opponent across three debate rounds. Get feedback on logic, persuasion and rebuttal.">
  <meta property="og:url" content="https://appdevelopsk.com/share/debate-me/">
  <meta property="og:image" content="https://appdevelopsk.com/icons/apps/debate-me.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none';">
  <title>Debate Me – AI Debate Practice | SK APPS</title>
  <meta name="description" content="Try Debate Me: choose a topic, debate an AI opponent and get feedback. Find the official iOS and Android store listings.">
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:#eef2ff;color:#171f3a}
    main{width:min(100%,500px);background:white;border:1px solid #dfe5f6;padding:30px 24px;border-radius:20px;box-shadow:0 14px 45px #20294e19;text-align:center}
    h1{font-size:1.8rem;margin:0 0 12px}
    p{line-height:1.6;color:#4b5875}
    .actions{display:grid;gap:12px;margin:24px 0 10px}
    a.action{padding:14px 20px;border-radius:12px;color:white;background:#3656d6;text-decoration:none;font-weight:700}
    a.action.secondary{background:#202b52}
    a.text{color:#3656d6;text-decoration:underline}
    small{color:#697493;line-height:1.5}
    @media(prefers-color-scheme:dark){body{background:#10182b;color:#eff2ff}main{background:#202b45;border-color:#384969}p,small{color:#c0cbe4}a.text{color:#aac0ff}}
  </style>
  <script src="landing.js" defer></script>
</head>
<body>
  <main>
    <h1>Debate Me</h1>
    <p data-copy="intro">Practice a three-round debate with an AI opponent, then get feedback on your arguments.</p>
    <div class="actions">
      <a id="android" class="action" href="https://play.google.com/store/apps/details?id=jp.appdevelopsk.debate_me" rel="noopener noreferrer" data-copy="android">Get it on Google Play</a>
      <a id="ios" class="action secondary" href="https://apps.apple.com/app/id6760968208" rel="noopener noreferrer" data-copy="ios">Open in the App Store</a>
    </div>
    <small data-copy="availability">Store availability may vary by region.</small>
    <p><a class="text" href="https://appdevelopsk.com/privacy-policy/debate-me/" data-copy="privacy">Privacy policy</a></p>
    <p><a class="text" href="https://appdevelopsk.com/apps" data-copy="otherApps">Explore other SK APPS</a></p>
  </main>
</body>
</html>
